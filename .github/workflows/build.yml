name: Build .NET 8 WinForms App

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Publish WinForms App (x64)
      run: dotnet publish "SSH Tunnel Manager/SSH Tunnel Manager.csproj" --configuration Release -r win-x64 --self-contained false --output ./publish-x64

    - name: Publish WinForms App (arm64)
      run: dotnet publish "SSH Tunnel Manager/SSH Tunnel Manager.csproj" --configuration Release -r win-arm64 --self-contained false --output ./publish-arm64

    - name: Upload Artifact (x64)
      uses: actions/upload-artifact@v7
      with:
        name: SSHTunnelManager-x64
        path: ./publish-x64
        
    - name: Upload Artifact (arm64)
      uses: actions/upload-artifact@v7
      with:
        name: SSHTunnelManager-arm64
        path: ./publish-arm64