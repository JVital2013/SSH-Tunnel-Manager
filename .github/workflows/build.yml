name: Build .NET 8 WinForms App

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    - name: Publish Application
      run: dotnet publish --configuration Release --no-build --output ./publish -r win-x64 --self-contained false

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinForms-App-Release
        path: ./publish
