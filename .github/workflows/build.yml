name: Build .NET 8 WinForms App

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish WinForms App
      run: dotnet publish "SSH Tunnel Manager/SSH Tunnel Manager.csproj" --configuration Release -r win-x64 --self-contained false --output ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SSHTunnelManager-App-Release
        path: ./publish
